name: Crowdin create project

on:
    workflow_dispatch:
        inputs:
            project_name:
                description: 'The project name to be used in Crowdin. Should correspond to a repository name.'
                required: true
                type: string

jobs:
    create-project-in-crowdin:
        runs-on: ubuntu-x64

        permissions:
            contents: read
            id-token: write # needed to get vault secrets

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false

            - name: 'Get vault secrets'
              id: vault-secrets
              uses: grafana/shared-workflows/actions/get-vault-secrets@main # zizmor: ignore[unpinned-uses]
              with:
                  # Vault secret paths:
                  # - ci/repo/grafana/grafana-github-actions/grafana-frontend-crowdin-create-project-token
                  # NOTE: this is different to the common secret used in other workflows since creating a project requires additional permissions
                  repo_secrets: |
                      CROWDIN_TOKEN=grafana-frontend-crowdin-create-project-token:access_token

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version-file: '.nvmrc'

            - run: yarn install --immutable --check-cache

            - name: Create project
              env:
                  PROJECT_NAME: ${{ inputs.project_name }}
                  CROWDIN_PERSONAL_TOKEN: ${{ fromJSON(steps.vault-secrets.outputs.secrets).CROWDIN_TOKEN }}
              run: node --experimental-strip-types ./.github/workflows/scripts/crowdin/create-project.ts
