name: Crowdin upload

on:
    workflow_call:
        inputs:
            crowdin_project_id:
                description: 'The Crowdin project ID'
                required: true
                type: string
        secrets:
            crowdin_token:
                description: 'Crowdin API token with access to the Crowdin project, used to upload translations.'
                required: true

jobs:
    upload-sources-to-crowdin:
        name: Upload sources to Crowdin
        runs-on: ubuntu-x64

        permissions:
            contents: read
            id-token: write # needed to get vault secrets

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Upload sources
              uses: crowdin/github-action@b8012bd5491b8aa8578b73ab5b5f5e7c94aaa6e2
              with:
                  upload_sources: true
                  upload_translations: false
                  download_translations: false
                  create_pull_request: false
                  base_url: 'https://grafana.api.crowdin.com'
                  config: 'crowdin.yml'
              env:
                  CROWDIN_PROJECT_ID: ${{ inputs.crowdin_project_id }}
                  CROWDIN_PERSONAL_TOKEN: ${{ secrets.crowdin_token }}
